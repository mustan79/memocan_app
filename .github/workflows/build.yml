name: Build Memocan Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean Memocan.spec
      - run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Memocan-Windows
          path: |
            dist/Memocan-Windows.zip
            dist/SHA256SUMS.txt
